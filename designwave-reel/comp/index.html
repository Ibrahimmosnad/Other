<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Designwave — brand introduction reel</title>
<link rel="stylesheet" href="/comp/brand/brand.css">
<style>
  html, body { margin: 0; background: #111; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--dw-cream); }
  #stage * { box-sizing: border-box; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  img.full { display: block; width: 1080px; height: 1920px; }

  /* Designwave voice: statements and labels */
  .stmt { position: absolute; left: 84px; font: 600 92px/0.98 var(--dw-sans); letter-spacing: -0.045em; color: var(--dw-ink); }
  .stmt .ln { display: block; overflow: hidden; padding: 0.02em 0.04em 0.12em; margin: -0.02em -0.04em -0.12em; }
  .stmt .ln > span { display: inline-block; will-change: transform; }
  .stmt em { font-family: var(--dw-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; font-size: 1.1em; line-height: 0.8; }
  .label { position: absolute; left: 84px; top: 262px; display: flex; align-items: center; gap: 16px; font: 500 40px/1 var(--dw-sans); letter-spacing: -0.02em; color: var(--dw-ink); }
  .label .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dw-blue); flex: none; }
  .label .txt { display: inline-block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
  .label .txt > span { display: inline-block; }
  .dashes { position: absolute; left: 84px; top: 330px; display: flex; gap: 8px; }
  .dashes i { display: block; width: 34px; height: 4px; border-radius: 2px; background: rgba(15,15,15,.16); }
  .dashes i.on { background: var(--dw-blue); }

  /* scene 1–2: the tag that becomes a product card */
  #tag { width: 540px; height: 960px; transform-origin: 0 0; border-radius: 10px; overflow: hidden; }
  #tag .fo-tag { border-radius: inherit; }
  #hints path, #hints rect { fill: none; stroke: rgba(15,15,15,.13); stroke-width: 2; }

  /* scene 4: phone with a live display */
  #s4wrap { position: absolute; overflow: hidden; }
  #s4cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #screen { position: absolute; width: 390px; height: 832px; overflow: hidden; border-radius: 52px; background: #fbfaf7; transform-origin: 50% 50%; }
  #screen .site-wrap { position: absolute; left: 0; top: 54px; width: 390px; }
  #screen .sticky { position: absolute; left: 0; top: 54px; width: 390px; height: 64px; background: var(--fo-paper); z-index: 3; }
  #screen .m-site .nav { visibility: hidden; }
  #screen > .status { position: absolute; left: 0; top: 0; width: 390px; z-index: 4; background: #fbfaf7; }
  #screen .morph { position: absolute; background-size: cover; background-position: 50% 58%; z-index: 2; }
  #screen .feed-layer { position: absolute; inset: 0; z-index: 1; }
  #glare { position: absolute; width: 390px; height: 832px; border-radius: 52px; transform-origin: 50% 50%; pointer-events: none;
           background: linear-gradient(118deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 100%); }
  .ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(245,242,236,.55); }

  /* tiles */
  .tile { position: absolute; overflow: hidden; border-radius: 6px; background: var(--fo-paper); transform-origin: 50% 50%; }
  .tile img { position: absolute; display: block; }
  .chips { display: flex; gap: 10px; }
  .chips i { width: 40px; height: 40px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }

  /* identity board */
  .swatch { position: absolute; width: 160px; height: 300px; border-radius: 4px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; font: 400 19px/1.35 var(--fo-sans); }
  .swatch b { font-weight: 500; display: block; }

  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; opacity: .12; background-repeat: repeat; }
  #safe { position: absolute; inset: 0; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="/comp/film.js"></script>
</body>
</html>
